name: iOS build and test

on:
  push:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?( Max)? \(' | head -1 | sed 's/ ($//')
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AuraDrive.xcodeproj \
            -scheme AuraDrive \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | xcbeautify --renderer github-actions

      - name: Print the settings screenshot (diagnostic)
        if: failure()
        run: |
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || exit 0
          FILE=$(python3 -c "import json;m=json.load(open('shots/manifest.json'));print(next(a['exportedFileName'] for t in m for a in t['attachments'] if 'settings-audit' in a.get('suggestedHumanReadableName','')))") || exit 0
          sips -Z 620 -s format jpeg -s formatOptions 35 "shots/$FILE" --out settings.jpg >/dev/null
          echo "SETTINGS_SCREENSHOT_BASE64=$(base64 -i settings.jpg | tr -d '\n')"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
